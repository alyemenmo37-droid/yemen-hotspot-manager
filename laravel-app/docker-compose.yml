version: '3.8'

services:
  # ═══════════════════════════════════════
  # Application (PHP-FPM + Nginx)
  # ═══════════════════════════════════════
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yhm_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_NAME=Yemen Hotspot Manager
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - APP_TIMEZONE=Asia/Aden
      - APP_LOCALE=ar
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=yhm
      - DB_USERNAME=yhm_user
      - DB_PASSWORD=yhm_password_2026
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - MIKROTIK_MOCK=true
      - MIKROTIK_HOST=192.168.88.1
    volumes:
      - storage_data:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yhm_network

  # ═══════════════════════════════════════
  # MySQL Database
  # ═══════════════════════════════════════
  db:
    image: mysql:8.0
    container_name: yhm_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=yhm
      - MYSQL_USER=yhm_user
      - MYSQL_PASSWORD=yhm_password_2026
      - MYSQL_ROOT_PASSWORD=root_password_2026
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_2026"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yhm_network

  # ═══════════════════════════════════════
  # Redis (Cache + Sessions + Queue)
  # ═══════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: yhm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yhm_network

# ═══════════════════════════════════════
# Volumes (Persistent data)
# ═══════════════════════════════════════
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
  storage_logs:
    driver: local

# ═══════════════════════════════════════
# Network
# ═══════════════════════════════════════
networks:
  yhm_network:
    driver: bridge
